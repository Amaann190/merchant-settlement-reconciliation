<rect width="1200" height="300" fill="#000000"/>
<rect width="1200" height="300" fill="url(#grid)"/>
<rect width="1200" height="300" fill="url(#chalo)"/>
<rect x="-320" y="0" width="320" height="1.5" fill="url(#sweep)"><animate attributeName="x" values="-320;1200;1200" keyTimes="0;.5;1" dur="8s" begin="1.2s" repeatCount="indefinite"/></rect>
<line x1="770" x2="770" y1="40" y2="260" stroke="#1f1f1f"/>
